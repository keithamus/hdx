[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
default-members = ["crates/*"]
exclude = ["packages/csskit_zed"]

[workspace.package]
version = "0.0.36-canary.80e172e77e"                                     # @release
authors = ["Keith Cirkel (https://keithcirkel.co.uk)"]
edition = "2024"
description = "Refreshing CSS!"
homepage = "https://csskit.rs"
repository = "https://github.com/csskit/csskit"
license = "MIT"
keywords = ["CSS", "parser"]

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.dependencies]
atom_set = { path = "crates/atom_set", version = "0.0.36-canary.80e172e77e" }                                                                          # @release
chromashift = { path = "crates/chromashift", version = "0.0.36-canary.80e172e77e" }                                                                    # @release
css_ast = { path = "crates/css_ast", version = "0.0.36-canary.80e172e77e" }                                                                            # @release
css_feature_data = { path = "crates/css_feature_data", version = "0.0.36-canary.80e172e77e" }                                                          # @release
css_lexer = { path = "crates/css_lexer", version = "0.0.36-canary.80e172e77e" }                                                                        # @release
css_parse = { path = "crates/css_parse", version = "0.0.36-canary.80e172e77e" }                                                                        # @release
css_value_definition_parser = { path = "crates/css_value_definition_parser", version = "0.0.36-canary.80e172e77e" }                                    # @release
csskit = { path = "crates/csskit", version = "0.0.36-canary.80e172e77e" }                                                                              # @release
csskit_arena = { path = "crates/csskit_arena", version = "0.0.36-canary.80e172e77e" }                                                                  # @release
csskit_ast = { path = "crates/csskit_ast", version = "0.0.36-canary.80e172e77e" }                                                                      # @release
csskit_derives = { path = "crates/csskit_derives", version = "0.0.36-canary.80e172e77e" }                                                              # @release
csskit_highlight = { path = "crates/csskit_highlight", version = "0.0.36-canary.80e172e77e" }                                                          # @release
csskit_lsp = { path = "crates/csskit_lsp", version = "0.0.36-canary.80e172e77e" }                                                                      # @release
csskit_napi = { path = "crates/csskit_napi", version = "0.0.36-canary.80e172e77e" }                                                                    # @release
csskit_proc_macro = { path = "crates/csskit_proc_macro", version = "0.0.36-canary.80e172e77e" }                                                        # @release
csskit_source_finder = { path = "crates/csskit_source_finder", version = "0.0.36-canary.80e172e77e" }                                                  # @release
csskit_spec_generator = { path = "tools/csskit_spec_generator", version = "0.0.36-canary.80e172e77e" }                                                  # @release
csskit_transform = { path = "crates/csskit_transform", version = "0.0.36-canary.80e172e77e" }                                                          # @release
derive_atom_set = { path = "crates/derive_atom_set", version = "0.0.36-canary.80e172e77e" }                                                            # @release
bytescan = { path = "crates/bytescan", version = "0.0.36-canary.80e172e77e" }                                                                          # @release
source_tools = { path = "crates/source_tools", version = "0.0.36-canary.80e172e77e" }                                                                  # @release
stable_type_layout = { package = "stable-type-layout", path = "crates/stable_type_layout", version = "0.0.36-canary.80e172e77e" }                      # @release
stable_type_layout_derive = { package = "stable-type-layout-derive", path = "crates/stable_type_layout_derive", version = "0.0.36-canary.80e172e77e" } # @release
visit_flow = { package = "visit-flow", path = "crates/visit_flow", version = "0.0.36-canary.80e172e77e" }                                              # @release
# Memory
allocator-api2 = { version = "0.4.0" }
inventory = { version = "0.3.25" }
libc = { version = "0.2.190" }
windows-sys = { version = "0.61.2" }
self_cell = { version = "1.3.0" }

# Data structure libraries/helpers
bitmask-enum = { version = "2.2.5" }
fnv = { version = "1.0.7" }
fearless_simd = { version = "1.1.0" }
indexmap = { version = "2.14.2" }
itertools = { version = "0.15.0" }
phf = { version = "0.14.0" }
ropey = { version = "1.6.1" }
smallvec = { version = "1.16.3" }
strum = { version = "0.28.0" }

anstyle = { version = "1.0.14" }
# CLI
clap = { version = "4.6.7" }
glob = { version = "0.3.4" }
owo-colors = { version = "4.4.0" }
project-root = { version = "0.2.2" }
strsim = { version = "0.11.1" }

httparse = { version = "1.10.1" }
# LSP packages
lsp-types = { version = "0.97.0" }

# Multithreading
crossbeam-channel = { version = "0.5.17" }
dashmap = { version = "6.2.1" }

console = { version = "0.16.6" }
# Logging
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }

anyhow = { version = "1.0.104" }
# Error handling
miette = { version = "7.6.0", default-features = false }
thiserror = { version = "2.0.21" }

darling = { version = "0.24.1" }
heck = { version = "0.5.0" }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
# Procc Macro Tools
syn = { version = "3.0.8" }
synstructure = { version = "0.14.0" }

# Serialization
serde = { version = "1.0.229" }
serde_json = { version = "1.0.154" }
toml = { version = "1.1.8" }

criterion = { version = "0.5.1" }    # Held back for pprof (https://github.com/tikv/pprof-rs/pull/271)
dhat = { version = "0.3.3" }
flate2 = { version = "1.1.10" }
insta = { version = "1.49.0" }
pprof = { version = "0.15.0" }
prettyplease = { version = "0.3.0" }
# Testing, benchmarking
similar = { version = "3.2.0" }

grep-matcher = { version = "0.1.9" }
# Build tools
grep-regex = { version = "0.1.14" }
grep-searcher = { version = "0.1.17" }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.5" }
scraper = { version = "0.27.0" }
tokio = { version = "1.53.2" }

console_error_panic_hook = { version = "0.1.7" }
serde-wasm-bindgen = { version = "0.6.5" }
# Wasm
wasm-bindgen = { version = "0.2.129" }
wasm-bindgen-test = { version = "0.3.79" }
web-sys = { version = "0.3.106" }

# NAPI (native object-model bindings)
napi = { version = "3.14.2", features = ["napi9"] }
napi-derive = { version = "3.6.12" }
napi-build = { version = "2.6.0" }

# CSS Feature Data packages
browserslist-rs = { version = "0.21.2", default-features = false }
chrono = { version = "0.4.45", default-features = false }

# For faster compiles during development, opt-level some dynamic libraries and limit debug generation

[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
criterion.opt-level = 3
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
# Optimise published artefacts for size.
opt-level = "s"
debug = false
strip = "symbols"
lto = "thin"
panic = "abort"   # Let it crash and force ourselves to write safe Rust.
codegen-units = 1

# Use the `--profile release-debug` flag to show symbols in release mode.
# e.g. `cargo build --profile release-debug`
[profile.release-debug]
inherits = "release"
debug = true
strip = false
