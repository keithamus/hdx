name: "Setup Environment"
description: "Common Rust/mise setup. Caller must checkout the repo first."
inputs:
  key:
    description: "Rust cache shared key"
    required: false
    default: global-rust-cache
  dir:
    description: "Working directory for mise"
    required: false
    default: ./
  tools:
    description: "Tools passed to mise install; empty installs all configured tools"
    required: false
    default: ""
  components:
    description: "Rustup components to install; empty skips component installation"
    required: false
    default: "rustfmt clippy"
  nightly:
    description: "Also install nightly toolchain with llvm-tools-preview"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Disable mise auto-install
      shell: bash
      run: echo "MISE_AUTO_INSTALL=false" >> "$GITHUB_ENV"

    - name: Mise
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        working_directory: ${{ inputs.dir }}
        install_args: ${{ inputs.tools }}
        env: false

    - name: Rust cache
      uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      with:
        shared-key: ${{ inputs.key }}

    - name: Install Rust components
      if: inputs.components != ''
      shell: bash
      run: rustup component add ${{ inputs.components }}

    - name: Install nightly toolchain
      if: inputs.nightly == 'true'
      shell: bash
      run: rustup toolchain install nightly --component llvm-tools-preview
