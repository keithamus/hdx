name: VSCode Release Automation (Including Automated PRs)

on:
  push:
    branches: [main]
    paths:
      - "packages/csskit_vscode/**"
  workflow_dispatch:

concurrency:
  group: "vscode-release"
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Get current and published versions
        id: versions
        run: |
          CURRENT=$(node -p "require('./packages/csskit_vscode/package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          PUBLISHED=$(npx --yes @vscode/vsce show csskit.csskit --json | jq -r '.versions[0].version')
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Show current versions
        run: |
          echo "Current version:   ${{ steps.versions.outputs.current }}"
          echo "Published version: ${{ steps.versions.outputs.published }}"
          echo "Mode:              ${{ steps.versions.outputs.mode }}"

      - name: Bump patch version
        if: steps.versions.outputs.mode == 'pr'
        id: bump
        run: |
          cd packages/csskit_vscode
          npm version patch --no-git-tag-version
          NEXT=$(node -p "require('./package.json').version")
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Stage version bump
        if: steps.versions.outputs.mode == 'pr'
        run: |
          NEXT="${{ steps.bump.outputs.next }}"
          echo "NEXT=${NEXT}" >> $GITHUB_ENV
          echo "VSCODE_BRANCH=vscode-release-v${NEXT}" >> $GITHUB_ENV
          git add packages/csskit_vscode/package.json packages/csskit_vscode/package-lock.json

      - name: Create release PR
        if: steps.versions.outputs.mode == 'pr'
        uses: ./.github/actions/create-pr
        with:
          token: ${{ secrets.RELEASE_PR_PAT }}
          branch: ${{ env.VSCODE_BRANCH }}
          commit-message: "Release csskit vscode extension v${{ env.NEXT }}"
          title: "Release csskit vscode extension v${{ env.NEXT }}"
          labels: release
          body: |
            Bumps the VS Code extension to v${NEXT} for publishing to the [marketplace](https://marketplace.visualstudio.com/items?itemName=csskit.csskit).

      - name: Install dependencies
        if: steps.versions.outputs.mode == 'publish'
        run: npm ci
        working-directory: packages/csskit_vscode

      - name: Publish to VS Code Marketplace
        if: steps.versions.outputs.mode == 'publish'
        run: npx --yes @vscode/vsce publish --skip-duplicate
        working-directory: packages/csskit_vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: steps.versions.outputs.mode == 'publish'
        run: npx --yes ovsx publish -p $OPEN_VSX_PAT
        working-directory: packages/csskit_vscode
        env:
          OPEN_VSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
