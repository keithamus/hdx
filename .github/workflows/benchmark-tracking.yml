name: Nightly Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  benchmark:
    name: Collect and Track Benchmarks
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download benchmark history
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          name: benchmark-history
          workflow: benchmark-tracking.yml
          workflow_conclusion: success
          branch: main
          search_artifacts: true
          path: website/_data

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run benchmark collection
        run: mise run collect-benchmarks

      - name: Upload benchmark history artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-history
          path: website/_data/benchmark-history.json
          retention-days: 90
